[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "energizer"
version = "0.2.0"
description = "A lightweight deep learning library for Apple Silicon (MLX/Metal training, Core ML Neural Engine inference)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10, <3.13"
authors = [
    { name = "Florian GRIMA", email = "florian.grima@epitech.eu" },
]
keywords = ["deep-learning", "neural-engine", "machine-learning", "mlx", "apple"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy",
    "mlx",
    "mlx-metal",
    "coremltools>=8.0",
]

[project.optional-dependencies]
mlx = ["mlx", "mlx-metal"]
gpu = ["mlx", "mlx-metal"]  # deprecated alias of "mlx"
dev = ["pytest", "torch", "torchvision"]
coreml = ["coremltools>=8.0"]
paper = ["matplotlib"]

[project.urls]
Homepage = "https://github.com/fgrimaepitech/energizer"
Repository = "https://github.com/fgrimaepitech/energizer"
Issues = "https://github.com/fgrimaepitech/energizer/issues"

[tool.setuptools.packages.find]
include = ["energizer*"]
exclude = ["tests*", "src*"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312", "py313"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | __pycache__
  | \.eggs
  | .*\.egg-info
)/
'''
